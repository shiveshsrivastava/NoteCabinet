[project]
name = "notecabinet"
version = "0.1.0"
description = "Privacy-focused notes assistant with fully on-device AI: cited answers over your markdown notes"
readme = "README.md"
authors = [{ name = "Shivesh Srivastava" }]
requires-python = ">=3.10"  # torch, transformers, langchain-core and fastapi all need 3.10+
keywords = ["rag", "local-llm", "llama-cpp", "sqlite", "notes", "embeddings"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]
dependencies = [
    "torch",
    "transformers",
    "sentence-transformers",
    "huggingface-hub",
    "numpy",
    "sqlite-vec",
    "pyyaml>=6.0.3",
    "pydantic>=2",
    "langchain-core",
    "langchain-text-splitters",
    "langchain-openai>=1.7.2",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx",  # FastAPI's TestClient; also used by scripts/smoke_test.py
]

[project.scripts]
notecabinet = "notecabinet.cli:main"

[project.urls]
Repository = "https://github.com/shiveshsrivastava/NoteCabinet"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notecabinet"]

[tool.hatch.build.targets.sdist]
include = ["notecabinet/", "tests/", "README.md", "CHANGELOG.md", "pyproject.toml"]

[dependency-groups]
# Local dataset tooling only (not part of the package).
datagen = ["anthropic", "wordfreq>=3.1.1"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: needs the bge embedder/reranker weights (run `notecabinet download-models` once); skipped if missing",
]
