[project]
name = "notecabinet"
version = "0.1.0"
description = "Local-first AI layer over a folder of markdown notes"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "sentence-transformers",
    "sqlite-vec",
    "httpx",
    "anthropic",
    "wordfreq>=3.1.1",
    "langchain-core",
    "langchain-text-splitters",
    "pyyaml>=6.0.3",
    "langchain-openai>=1.7.2",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
notecabinet = "notecabinet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
